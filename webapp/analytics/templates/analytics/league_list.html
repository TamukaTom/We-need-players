{% extends "analytics/base.html" %}

{% block content %}
<h1>Leagues</h1>
<div class="grid">
  {% for lg in leagues %}
  <a class="league-card" href="{% url 'league_detail' lg.slug %}">
    <strong>{{ lg.display }}</strong><br>
    <span class="muted">{{ lg.count }} teams</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
