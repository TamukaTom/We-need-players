<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Football Team Analytics{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 1rem; color: #222; }
    header { border-bottom: 2px solid #1f3a5f; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: baseline; }
    header a { color: #1f3a5f; text-decoration: none; font-weight: 700; font-size: 1.3rem; }
    header nav a { font-size: 1rem; font-weight: 400; margin-left: 1rem; }
    h2 { color: #1f3a5f; margin-top: 1.5rem; }
    .muted { color: #666; font-size: 0.9rem; }
    .card { background: #f5f7fa; border-left: 4px solid #1f3a5f; padding: 0.5rem 1rem; }
    .card ul { padding-left: 1.1rem; margin: 0.3rem 0; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; }
    th a { color: #1f3a5f; text-decoration: none; }
    .bar { background: #e5e8ec; height: 10px; width: 160px; border-radius: 5px; }
    .fill { height: 10px; border-radius: 5px; background: #8a97a8; }
    .fill.strength { background: #2e8b57; }
    .fill.weakness { background: #c0392b; }
    .tag { font-size: 0.8rem; padding: 1px 6px; border-radius: 4px; background: #e5e8ec; }
    .tag.strength { background: #d4edda; color: #1d6b3a; }
    .tag.weakness { background: #f8d7da; color: #8a1f1f; }
    .filters label { margin-right: 1rem; }
    .filters input { width: 4rem; }
    .filters select { margin-right: 0.8rem; }
    .grid, .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
    .league-card { display: block; padding: 1rem; border: 1px solid #ddd; border-radius: 6px; text-decoration: none; color: #1f3a5f; }
    .league-card:hover { background: #f5f7fa; }
    .filters input[type="text"] { width: 14rem; }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'team_list' %}">Football Team Analytics</a>
    <nav><a href="{% url 'team_list' %}">Teams</a> <a href="{% url 'league_list' %}">Leagues</a> <a href="{% url 'player_list' %}">Players</a></nav>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
